<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Bean & Brew</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

<div class="vintage-overlay"></div>

<header>
  <a th:href="@{/}" class="logo">Bean & Brew</a>
  <div class="auth-buttons">
    <a th:href="@{/signup}" class="btn-signup">회원가입</a>
  </div>
</header>

<main class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>당신의 향기로운 일상이 다시 시작됩니다.</p>
    </div>

    <form th:action="@{/login}" th:object="${dto}" method="post" class="auth-form">
      <div th:if="${#fields.hasGlobalErrors()}" class="p-3 mb-4 text-sm text-red-700 bg-red-100 rounded-lg">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
      </div>

      <div class="input-group">
        <label for="loginId">Email Address</label>
        <input type="email" th:field="*{loginId}" id="loginId" name="loginId" required placeholder="example@coffee.com">
        <p th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}" class="text-red-500 text-xs mt-1"></p>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" th:field="*{password}" id="password" name="password" required placeholder="••••••••">
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-xs mt-1"></p>
      </div>

      <div class="auth-options">
        <label class="remember-me">
          <input type="checkbox" name="remember-me"> <span>Keep me logged in</span>
        </label>
        <a href="#" class="find-pw">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-auth-submit">Sign In</button>
    </form>

    <div class="auth-footer">
      <p>계정이 없으신가요? <a th:href="@{/signup}">회원가입 하기</a></p>
    </div>
  </div>
</main>

<footer>
  &copy; 2026 BEAN & BREW VINTAGE COFFEE. ALL RIGHTS RESERVED.
</footer>

</body>
</html>
