<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Spring Cafe</title>
  <style>
    .menu-card { border: 1px solid #ddd; padding: 15px; margin: 10px; border-radius: 8px; display: inline-block; width: 200px; }
    .price { color: #e67e22; font-weight: bold; }
    .order-btn { background: #27ae60; color: white; border: none; padding: 5px 10px; cursor: pointer; }
  </style>
</head>
<body>
<h1>☕ Coffee Menu</h1>
<div th:each="menu : ${menus}" class="menu-card">
  <h3 th:text="${menu.name}">메뉴명</h3>
  <p class="price" th:text="${menu.price} + '원'">가격</p>
  <form action="/api/v1/cafe/order" method="post">
    <input type="hidden" name="menuId" th:value="${menu.id}">
    <input type="number" name="count" value="1" min="1" style="width: 40px;">
    <button type="submit" class="order-btn">주문하기</button>
  </form>
</div>
</body>
</html>
